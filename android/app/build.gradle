plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myidentity.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myidentity.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        
buildConfigField "String", "WEB_URL", '"https://talha-information-01.onrender.com/"'
}

    buildFeatures {
        buildConfig true
    }
}
